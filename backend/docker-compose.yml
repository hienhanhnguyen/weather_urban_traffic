name: thesis-backend

services:
  db:
    image: postgres:18-alpine
    container_name: thesis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin    
    ports:
      - "5433:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d weather_traffic"]
        interval: 10s
        timeout: 5s
        retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:18-alpine
    container_name: thesis-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_traffic_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_traffic_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: